&lt;style&gt;
  :root{
    --ink:#0B1A2E; --navy800:#142B47;
    --bronze:#A9784F; --bronze-light:#C9A06C; --bronze-dark:#8A5F3C;
    --cream:#F8F4EC; --cream-deep:#EFE7D8; --white:#FFFFFF;
    --charcoal:#3B3A36; --warm-grey:#7A7468;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--charcoal);background:var(--cream);padding-top:44px;}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;color:var(--ink);}
  a{text-decoration:none;color:inherit;cursor:pointer;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 28px;}
  .btn{display:inline-block;padding:13px 26px;font-weight:500;font-size:13.5px;letter-spacing:0.2px;cursor:pointer;border:none;}
  .btn-bronze{background:var(--bronze);color:#fff;}
  .btn-bronze:hover{background:var(--bronze-dark);}
  .btn-outline{background:transparent;color:var(--cream);border:1px solid rgba(248,244,236,0.4);}
  .btn-ink{background:var(--ink);color:var(--cream);}
  .btn-outline-ink{background:transparent;color:var(--ink);border:1px solid var(--ink);}

  /* Edit toolbar */
  #editToolbar{position:fixed;top:0;left:0;right:0;z-index:200;background:#1c1c1c;color:#f0f0f0;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12.5px;}
  #editToolbar button{background:var(--bronze);color:#fff;border:none;padding:8px 16px;font-size:12px;font-weight:500;cursor:pointer;}
  #exportPanel{position:fixed;top:44px;left:0;right:0;z-index:199;background:#fff;border-bottom:2px solid var(--bronze);padding:16px 20px;display:none;max-height:40vh;overflow:auto;}
  #exportPanel textarea{width:100%;min-height:120px;font-family:monospace;font-size:12px;padding:10px;border:1px solid var(--cream-deep);}
  #exportPanel .close{float:right;cursor:pointer;font-size:13px;color:var(--warm-grey);}
  [contenteditable=&quot;true&quot;]:hover{outline:1px dashed var(--bronze-light);outline-offset:2px;}
  [contenteditable=&quot;true&quot;]:focus{outline:2px solid var(--bronze);outline-offset:2px;background:rgba(169,120,79,0.06);}
  .block{position:relative;}
  .block-ctrl{position:absolute;top:-14px;right:0;display:none;gap:4px;z-index:10;}
  .block:hover .block-ctrl{display:flex;}
  .block-ctrl button{background:var(--ink);color:#fff;border:none;width:24px;height:24px;font-size:12px;cursor:pointer;line-height:1;}
  .block-ctrl button:hover{background:var(--bronze);}

  /* Nav */
  header{background:var(--white);border-bottom:1px solid var(--cream-deep);position:sticky;top:44px;z-index:50;}
  nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1200px;margin:0 auto;}
  .wordmark{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:20px;color:var(--ink);letter-spacing:3px;cursor:pointer;}
  .navlinks{display:flex;gap:4px;list-style:none;position:relative;align-items:center;}
  .navlinks&gt;li{position:relative;}
  .navlinks&gt;li&gt;span{display:flex;align-items:center;gap:5px;padding:10px 14px;font-size:13.5px;font-weight:500;color:var(--charcoal);cursor:pointer;border-radius:3px;}
  .navlinks&gt;li:hover&gt;span{background:var(--cream);color:var(--ink);}
  .navlinks&gt;li:hover .dropdown{display:block;}
  .dropdown{display:none;position:absolute;top:100%;left:0;background:var(--white);border:1px solid var(--cream-deep);min-width:260px;box-shadow:0 12px 28px rgba(11,26,46,0.08);padding:8px;z-index:60;}
  .dropdown a{display:block;padding:11px 12px;font-size:13px;border-radius:2px;}
  .dropdown a:hover{background:var(--cream);}
  .nav-cta-group{display:flex;gap:10px;align-items:center;}

  /* Shared section chrome */
  section{padding:64px 0;}
  .eyebrow{color:var(--bronze-dark);font-size:11.5px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;}
  .section-title{font-size:27px;font-weight:600;margin:10px 0 10px;max-width:680px;}
  .section-sub{color:var(--warm-grey);font-size:14.5px;max-width:640px;margin-bottom:34px;line-height:1.65;}
  .crumb{font-size:12px;color:var(--warm-grey);padding:12px 0;}
  .crumb a{color:var(--bronze-dark);}

  /* Hero (home) */
  .hero{background:var(--ink);color:var(--cream);padding:90px 0 70px;}
  .hero .tag{display:inline-block;color:var(--bronze-light);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px;}
  .hero .rule{width:44px;height:1px;background:var(--bronze);margin-bottom:24px;}
  .hero h1{font-size:40px;line-height:1.22;font-weight:500;color:var(--cream);max-width:680px;}
  .hero p.lead{font-size:16px;color:#D8CDBC;max-width:560px;margin:20px 0 30px;line-height:1.75;}
  .hero .cta-row{display:flex;gap:16px;flex-wrap:wrap;}

  /* Generic hero for sub-views */
  .pagehero{background:var(--ink);color:var(--cream);padding:50px 0 40px;}
  .pagehero .tag{display:inline-block;background:rgba(248,244,236,0.08);border:1px solid rgba(248,244,236,0.18);color:var(--bronze-light);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px;margin-bottom:16px;}
  .pagehero h1{font-size:30px;font-weight:500;color:var(--cream);max-width:660px;line-height:1.3;}
  .pagehero p{color:#D8CDBC;max-width:560px;margin-top:14px;font-size:14.5px;line-height:1.7;}
  .stat-row{display:flex;gap:30px;margin-top:22px;flex-wrap:wrap;}
  .stat .v{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--bronze-light);}
  .stat .l{font-size:11px;color:#B9AF9E;text-transform:uppercase;letter-spacing:0.6px;}

  /* Conseil / réseau */
  .conseil-top{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;margin-bottom:48px;}
  .conseil-callout{background:var(--cream);border-left:2px solid var(--bronze);padding:22px 26px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--navy800);line-height:1.5;}
  .metiers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .metier-card{background:var(--cream);border:1px solid var(--cream-deep);padding:20px 18px;}
  .metier-card h4{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:5px;}
  .metier-card p{font-size:12.5px;color:var(--warm-grey);line-height:1.5;}

  /* Conseiller / relation */
  .relation{background:var(--ink);color:var(--cream);}
  .relation .grid2{display:grid;grid-template-columns:1.1fr 0.9fr;gap:60px;align-items:center;}
  .founder{background:rgba(248,244,236,0.06);border:1px solid rgba(248,244,236,0.14);padding:32px;}
  .founder .avatar{width:52px;height:52px;border-radius:50%;background:var(--bronze);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:22px;color:#fff;margin-bottom:16px;}
  .founder h4{font-family:'Cormorant Garamond',serif;color:var(--cream);font-size:19px;}
  .founder .role{color:var(--bronze-light);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
  .founder p{font-size:14px;color:#D8CDBC;margin-top:14px;line-height:1.65;}

  /* Steps / cards generic */
  .steps3, .process-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .step-card, .ps-card{background:var(--white);border:1px solid var(--cream-deep);padding:26px 22px;}
  .step-card .n, .ps-card .n{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--bronze);font-weight:500;margin-bottom:12px;}
  .step-card h3, .ps-card h4{font-size:16px;margin-bottom:8px;}
  .step-card p, .ps-card p{font-size:13.5px;color:var(--warm-grey);line-height:1.6;}

  .comment{background:var(--cream-deep);}

  /* Teasers (structuration / deals) */
  .st-grid, .dt-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;}
  .st-card{background:var(--navy800);color:var(--cream);padding:30px;}
  .st-card h4{color:var(--cream);font-size:18px;margin-bottom:10px;}
  .st-card p{font-size:13.5px;color:#D8CDBC;line-height:1.6;}

  /* Méthode */
  .methode-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:6px;}
  .methode-strip div{border-top:2px solid var(--bronze);padding-top:14px;}
  .methode-strip .n{font-family:'Cormorant Garamond',serif;color:var(--bronze);font-size:20px;font-weight:600;}
  .methode-strip h4{font-size:13px;margin-top:6px;line-height:1.35;}

  /* Philosophie */
  .philosophie{background:var(--cream-deep);}
  .philo-row{display:grid;grid-template-columns:56px 1fr;gap:26px;padding:24px 0;border-top:1px solid rgba(11,26,46,0.08);}
  .philo-row:last-child{border-bottom:1px solid rgba(11,26,46,0.08);}
  .philo-row .num{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--bronze);font-weight:500;}
  .philo-row h3{font-size:16.5px;margin-bottom:6px;}
  .philo-row p{font-size:14px;color:var(--warm-grey);max-width:560px;line-height:1.6;}

  /* Trust / FAQ */
  .trust{background:var(--cream-deep);}
  .trust-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .trust-card{background:var(--white);padding:26px;border:1px solid var(--cream-deep);}
  .trust-card h4{font-size:16.5px;margin-bottom:8px;}
  .trust-card p{font-size:13px;color:var(--warm-grey);line-height:1.6;}
  .faq-item{border-top:1px solid var(--cream-deep);padding:22px 0;}
  .faq-item:last-child{border-bottom:1px solid var(--cream-deep);}
  .faq-item .q{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .faq-item .a{font-size:13.5px;color:var(--warm-grey);line-height:1.6;max-width:680px;}

  /* Step nav (R0/R1/R2) */
  .step-nav-wrap{background:var(--white);border:1px solid var(--cream-deep);padding:26px 20px 12px;margin-bottom:26px;}
  .step-nav{display:flex;justify-content:space-between;position:relative;max-width:520px;margin:0 auto;padding:0 10px;}
  .step-nav::before{content:&quot;&quot;;position:absolute;top:6px;left:6%;right:6%;height:1px;background:var(--cream-deep);z-index:0;}
  .step-nav-item{position:relative;text-align:center;flex:1;z-index:1;cursor:pointer;}
  .step-nav-item .arrow-tag{display:none;position:absolute;top:-28px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:600;color:var(--bronze-dark);}
  .step-nav-item.viewing .arrow-tag{display:block;}
  .step-explain-box{margin-top:24px;text-align:center;}
  .step-explain{display:none;max-width:640px;margin:0 auto;}
  .step-explain.active{display:block;}
  .step-explain .se-intro{text-align:center;margin-bottom:22px;}
  .step-explain b{display:block;font-size:12.5px;color:var(--charcoal);font-weight:600;margin-bottom:6px;}
  .step-explain p{font-size:12px;color:var(--warm-grey);line-height:1.65;margin:0;}
  .step-explain .se-body{text-align:left;}
  .step-explain .se-body .esp-card,.step-explain .se-body .audit-card,.step-explain .se-body .doc-cat{margin-bottom:0;}
  .step-nav-item .dot{width:14px;height:14px;border-radius:50%;background:var(--white);border:2px solid var(--cream-deep);display:inline-block;margin-bottom:8px;}
  .step-nav-item .lbl{display:block;font-size:11.5px;color:var(--warm-grey);font-weight:500;}
  .step-nav-item.done .dot{border-color:var(--bronze);background:var(--bronze);}
  .step-nav-item.active .dot{border-color:var(--bronze);background:var(--cream);box-shadow:0 0 0 5px rgba(169,120,79,0.22), 0 0 16px 4px rgba(169,120,79,0.4);}
  .step-nav-item.active .lbl{color:var(--ink);font-weight:600;}


  /* Booking (R0) */
  .booking{background:var(--white);border:1px solid var(--cream-deep);padding:30px;}
  .booking-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .duration-opt{padding:10px 18px;border:1px solid var(--cream-deep);font-size:13px;color:var(--charcoal);cursor:pointer;}
  .duration-opt.selected{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
  .cat-opt{padding:12px 14px;border:1px solid var(--cream-deep);font-size:12.5px;color:var(--charcoal);cursor:pointer;text-align:center;}
  .cat-opt.selected{background:var(--cream-deep);border-color:var(--bronze);color:var(--ink);font-weight:600;}
  .slots-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
  .slot{padding:10px;border:1px solid var(--cream-deep);font-size:12.5px;text-align:center;cursor:pointer;color:var(--charcoal);}
  .slot.selected{background:var(--bronze);color:#fff;border-color:var(--bronze);}
  .field-label{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--bronze-dark);font-weight:600;margin-bottom:10px;}
  .why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .why-card{background:var(--white);border:1px solid var(--cream-deep);padding:22px;}
  .why-card h4{font-size:14.5px;color:var(--ink);margin-bottom:8px;}
  .why-card p{font-size:12.5px;color:var(--warm-grey);line-height:1.55;}

  /* R1 stratégie sur-mesure : audit + conseiller + reco */
  .audit-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;}
  .audit-card{background:var(--white);border:1px solid var(--cream-deep);padding:30px;}
  .audit-card .label{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--bronze-dark);font-weight:600;margin-bottom:10px;}
  .audit-card h3{font-size:20px;margin-bottom:6px;}
  .audit-card .meta{font-size:12.5px;color:var(--warm-grey);margin-bottom:20px;}
  .audit-rows{border-top:1px solid var(--cream-deep);}
  .audit-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--cream-deep);font-size:13px;}
  .audit-row span:first-child{color:var(--warm-grey);}
  .audit-row span:last-child{color:var(--ink);font-weight:500;}
  .audit-side{background:var(--navy800);color:var(--cream);padding:26px;}
  .audit-side h4{font-family:'Cormorant Garamond',serif;color:var(--cream);font-size:16px;margin-bottom:10px;}
  .audit-side p{font-size:12.5px;color:#D8CDBC;line-height:1.6;margin-bottom:6px;}
  .lockline{font-size:11px;color:var(--bronze-light);font-style:italic;margin-top:10px;}
  .row-btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .row-btns span{font-size:11.5px;padding:8px 13px;background:var(--bronze);color:#fff;font-weight:500;cursor:pointer;}

  .conseiller-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px;}
  .chat-card{background:var(--cream);border:1px solid var(--cream-deep);padding:22px;}
  .chat-card h4{font-size:14.5px;color:var(--ink);margin-bottom:14px;}
  .bubble{max-width:80%;padding:10px 14px;font-size:12.5px;margin-bottom:10px;line-height:1.5;}
  .bubble.them{background:var(--white);color:var(--charcoal);border-radius:0 8px 8px 8px;}
  .bubble.me{background:var(--ink);color:var(--cream);border-radius:8px 0 8px 8px;margin-left:auto;}
  .rdv-mini{background:var(--cream);border:1px solid var(--cream-deep);padding:22px;}
  .rdv-mini h4{font-size:14.5px;color:var(--ink);margin-bottom:14px;}
  .rdv-item{display:flex;justify-content:space-between;align-items:center;background:var(--white);padding:12px 14px;font-size:12.5px;margin-bottom:8px;}
  .rdv-item .rstatus{font-size:10.5px;padding:3px 8px;background:var(--bronze);color:#fff;}

  .reco-tabs{display:flex;gap:10px;margin:26px 0 24px;flex-wrap:wrap;}
  .reco-tab{padding:9px 16px;font-size:12.5px;font-weight:500;border:1px solid var(--cream-deep);color:var(--charcoal);cursor:pointer;}
  .reco-tab.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .rm-item{display:grid;grid-template-columns:120px 1fr auto;gap:20px;align-items:center;background:var(--cream);border:1px solid var(--cream-deep);padding:20px 22px;margin-bottom:12px;}
  .rm-item .rm-status{font-size:11px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;padding:6px 10px;text-align:center;}
  .rm-item .rm-status.etude{background:var(--cream-deep);color:var(--warm-grey);}
  .rm-item .rm-status.reco{background:var(--bronze);color:#fff;}
  .rm-item .rm-status.cours{background:var(--navy800);color:var(--cream);}
  .rm-item h4{font-size:15px;color:var(--ink);margin-bottom:4px;}
  .rm-item p{font-size:12.5px;color:var(--warm-grey);}
  .rm-item .rm-cta{font-size:12.5px;color:var(--ink);font-weight:500;white-space:nowrap;cursor:pointer;}

  /* R2 gouvernance */
  .gov-timeline{border-left:2px solid var(--cream-deep);padding-left:26px;}
  .gov-item{position:relative;padding-bottom:28px;}
  .gov-item::before{content:&quot;&quot;;position:absolute;left:-32px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--bronze);}
  .gov-item .gdate{font-size:11.5px;color:var(--bronze-dark);font-weight:600;letter-spacing:0.5px;margin-bottom:4px;}
  .gov-item h4{font-size:15px;color:var(--ink);margin-bottom:5px;}
  .gov-item p{font-size:12.5px;color:var(--warm-grey);line-height:1.55;}
  .suivi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .suivi-card{background:var(--white);border:1px solid var(--cream-deep);padding:22px;}
  .suivi-card h4{font-size:14.5px;color:var(--ink);margin-bottom:8px;}
  .suivi-card p{font-size:12.5px;color:var(--warm-grey);line-height:1.55;}

  /* Docs collaboratifs */
  .docs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px;}
  .doc-cat{background:var(--white);border:1px solid var(--cream-deep);padding:20px;}
  .doc-cat h4{font-size:14px;color:var(--ink);margin-bottom:12px;}
  .doc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--cream-deep);font-size:12px;}
  .doc-row:last-child{border-bottom:none;}
  .doc-row .ddl{color:var(--bronze-dark);font-weight:600;cursor:pointer;}

  /* Réseau band */
  .metiers-band{background:var(--navy800);color:var(--cream);}
  .metiers-band .section-sub{color:#D8CDBC;}
  .mb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .mb-card{background:rgba(248,244,236,0.05);border:1px solid rgba(248,244,236,0.14);padding:18px;}
  .mb-card h4{color:var(--cream);font-size:14px;margin-bottom:5px;}
  .mb-card p{color:#B9AF9E;font-size:12px;line-height:1.5;}

  /* Recommandations hub */
  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .r-card{background:var(--white);border:1px solid var(--cream-deep);padding:20px;}
  .r-card:hover{border-color:var(--bronze);}
  .r-card .cat{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--bronze-dark);font-weight:600;}
  .r-card h4{font-size:15.5px;color:var(--ink);margin:8px 0 8px;}
  .r-card p{font-size:12.5px;color:var(--warm-grey);line-height:1.55;margin-bottom:14px;}
  .r-card .go{font-size:12px;color:var(--ink);font-weight:500;}
  .r-card.soon{opacity:0.55;}

  /* Produit fiche */
  .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .feat-card{background:var(--white);border:1px solid var(--cream-deep);padding:22px;}
  .feat-card h4{font-size:14.5px;color:var(--ink);margin-bottom:8px;}
  .feat-card p{font-size:12.5px;color:var(--warm-grey);line-height:1.55;}
  .pro-card{background:var(--navy800);color:var(--cream);padding:26px;display:flex;gap:18px;align-items:flex-start;}
  .pro-card .av{width:48px;height:48px;border-radius:50%;background:var(--bronze);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:19px;flex-shrink:0;}
  .pro-card h4{color:var(--cream);font-size:16px;margin-bottom:3px;}
  .pro-card .role{color:var(--bronze-light);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  .pro-card p{color:#D8CDBC;font-size:13px;line-height:1.6;}
  .fees-note{background:var(--cream-deep);border-left:2px solid var(--bronze);padding:20px 22px;font-size:13px;color:var(--warm-grey);line-height:1.65;}
  .fees-note b{color:var(--ink);}
  .cta-band{background:var(--cream-deep);text-align:center;}
  .cta-band .section-title, .cta-band .section-sub{margin-left:auto;margin-right:auto;}
  .cta-band .btn{margin-top:4px;}

  /* Frais */
  .fee-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;text-align:left;}
  .fee-card{background:var(--white);border:1px solid var(--cream-deep);padding:24px;}
  .fee-card .pct{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--bronze);margin-bottom:8px;}
  .fee-card h4{font-size:15px;color:var(--ink);margin-bottom:8px;}
  .fee-card p{font-size:12.5px;color:var(--warm-grey);line-height:1.55;}
  .honoraires{background:var(--ink);color:var(--cream);border-bottom:1px solid rgba(201,160,108,0.3);}
  .hon-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .hon-card{background:rgba(248,244,236,0.05);border:1px solid rgba(248,244,236,0.14);padding:24px;}
  .hon-card h4{color:var(--cream);font-size:15px;margin-bottom:8px;}
  .hon-card p{color:#D8CDBC;font-size:13px;line-height:1.6;}
  .principle-box{background:var(--white);border-left:2px solid var(--bronze);padding:22px 26px;font-size:14px;color:var(--charcoal);line-height:1.7;}
  .principle-box b{color:var(--ink);}
  .fee-card .step-num{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--bronze);line-height:1;}
  .fee-card .fee-badge{font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--warm-grey);font-weight:600;margin:4px 0 10px;}
  .fee-equation{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin-top:30px;}
  .eq-line1{color:var(--warm-grey);font-size:14px;}
  .eq-or{color:var(--warm-grey);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;margin:0 8px;}
  .eq-line2{color:var(--warm-grey);font-size:15.5px;font-weight:600;letter-spacing:0.3px;}
  .fee-caveat{font-size:12px;color:var(--warm-grey);font-style:italic;text-align:center;margin-top:18px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.6;}

  /* Types deals / services structuration */
  .types-grid, .services-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .type-card, .service-card{background:var(--white);border:1px solid var(--cream-deep);padding:22px 20px;}
  .type-card h4, .service-card h4{font-size:15px;color:var(--ink);margin-bottom:6px;}
  .type-card p, .service-card p{font-size:12.5px;color:var(--warm-grey);line-height:1.5;}
  .apport-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;}
  .apport-list{list-style:none;}
  .apport-list li{position:relative;padding:12px 0 12px 24px;font-size:14px;color:#D8CDBC;border-bottom:1px solid rgba(248,244,236,0.12);}
  .apport-list li::before{content:&quot;-&quot;;position:absolute;left:0;color:var(--bronze-light);}
  .apport-card{background:rgba(248,244,236,0.06);border:1px solid rgba(248,244,236,0.14);padding:30px;}
  .apport-card h4{color:var(--cream);font-size:18px;margin-bottom:10px;}
  .apport-card p{color:#D8CDBC;font-size:13.5px;line-height:1.65;}

  /* Form fields (deals) */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start;}
  .form-card{background:var(--white);border:1px solid var(--cream-deep);padding:30px;}
  .form-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .form-fields .f{background:var(--cream);padding:12px 14px;font-size:12.5px;color:var(--warm-grey);border:1px solid var(--cream-deep);}
  .form-fields .f.full{grid-column:1/-1;}
  .form-fields select.f, .form-fields input.f, .form-fields textarea.f{background:var(--white);color:var(--charcoal);font-family:inherit;width:100%;cursor:pointer;outline:none;}
  .form-fields input.f, .form-fields textarea.f{cursor:text;}
  .form-fields textarea.f{resize:vertical;min-height:70px;}
  .form-fields select.f:invalid{color:var(--warm-grey);}
  .partner-cat-fields{display:none;}
  .partner-cat-fields.active{display:contents;}
  .note-box{background:var(--white);border-left:2px solid var(--bronze);padding:20px 22px;font-size:13px;color:var(--warm-grey);line-height:1.7;}
  .note-box b{color:var(--ink);}

  /* Questionnaire */
  .qwrap{max-width:640px;margin:0 auto;padding:30px 28px 60px;}
  .progress{display:flex;gap:6px;margin-bottom:26px;}
  .progress span{flex:1;height:3px;background:var(--cream-deep);}
  .progress span.done{background:var(--bronze);}
  .qstep{background:var(--white);border:1px solid var(--cream-deep);padding:26px;margin-bottom:14px;}
  .qstep .qn{font-size:11px;color:var(--bronze-dark);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
  .qstep h3{font-size:17px;margin-bottom:16px;}
  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .opt{padding:12px 16px;border:1px solid var(--cream-deep);font-size:13px;cursor:pointer;text-align:center;}
  .opt.selected{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .opt.full{grid-column:1/-1;}

  /* Produits (catalogue public) */
  .prod-cat-block{margin-bottom:50px;}
  .prod-cat-block:last-child{margin-bottom:0;}
  .prod-cat-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;}
  .prod-cat-head h3{font-size:20px;}
  .prod-cat-head .cnt{font-size:12px;color:var(--warm-grey);}
  .prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .prod-card{background:var(--white);border:1px solid var(--cream-deep);padding:20px 22px;cursor:pointer;transition:border-color .15s;}
  .prod-card:hover{border-color:var(--bronze);}
  .prod-card h4{font-size:15px;color:var(--ink);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .prod-card h4 .chev{font-size:12px;color:var(--bronze-dark);transition:transform .15s;}
  .prod-card.expanded h4 .chev{transform:rotate(90deg);}
  .prod-card .oneline{font-size:12.5px;color:var(--warm-grey);line-height:1.5;}
  .prod-card .detail{max-height:0;overflow:hidden;transition:max-height .2s ease;}
  .prod-card.expanded .detail{max-height:400px;margin-top:12px;padding-top:12px;border-top:1px solid var(--cream-deep);}
  .prod-card .detail p{font-size:12.5px;color:var(--charcoal);line-height:1.65;}

  /* Cas d'usage */
  .case-card{background:var(--white);border:1px solid var(--cream-deep);padding:30px;margin-bottom:22px;}
  .case-card .case-tag{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--bronze-dark);margin-bottom:10px;}
  .case-card h3{font-size:19px;margin-bottom:14px;}
  .case-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;}
  .case-cols .cc-label{font-size:11px;letter-spacing:0.6px;text-transform:uppercase;color:var(--warm-grey);font-weight:600;margin-bottom:6px;}
  .case-cols p{font-size:13px;color:var(--charcoal);line-height:1.6;}

  footer{background:var(--ink);color:#9C917E;padding:44px 0 30px;font-size:11.5px;}
  footer a{color:#D8CDBC;}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:26px;margin-bottom:26px;}
  .footer-grid h5{color:var(--cream);font-size:12px;letter-spacing:0.6px;text-transform:uppercase;margin-bottom:14px;font-weight:600;}
  .footer-grid ul{list-style:none;}
  .footer-grid li{margin-bottom:9px;font-size:12.5px;}
  .footer-bottom{border-top:1px solid rgba(248,244,236,0.1);padding-top:18px;text-align:center;}

  .view{display:none;}
  .view.visible{display:block;}

  @media (max-width:900px){
    .conseil-top, .relation .grid2, .st-grid, .dt-grid, .audit-grid, .conseiller-grid, .form-grid, .apport-grid{grid-template-columns:1fr;}
    .metiers-grid, .steps3, .trust-grid, .why-grid, .docs-grid, .feat-grid, .card-grid, .process-steps, .fee-grid, .hon-grid, .types-grid, .services-grid, .suivi-grid, .cat-grid, .opt-grid, .prod-grid{grid-template-columns:1fr 1fr;}
    .methode-strip{grid-template-columns:1fr 1fr;}
    .rm-item{grid-template-columns:1fr;}
    .case-cols{grid-template-columns:1fr;}
    .footer-grid{grid-template-columns:1fr 1fr;}
    .navlinks{display:none;}
  }

  /* Cas d'usage - version allégée */
  .case-light-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .case-light{background:var(--white);border:1px solid var(--cream-deep);padding:26px 22px;text-align:center;cursor:pointer;}
  .case-light .icon-circle{width:44px;height:44px;border-radius:50%;background:var(--bronze);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:17px;margin:0 auto 14px;}
  .case-light .case-tag2{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--bronze-dark);font-weight:600;}
  .case-light h3{font-size:16.5px;margin:8px 0 10px;line-height:1.35;}
  .case-light .punch{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--navy800);font-size:14.5px;line-height:1.5;}
  .case-light .case-toggle{display:inline-block;margin-top:14px;font-size:11.5px;color:var(--bronze-dark);font-weight:600;}
  .case-light .case-toggle .chev{display:inline-block;transition:transform .15s;margin-left:3px;}
  .case-light.expanded .case-toggle .chev{transform:rotate(90deg);}
  .case-light .case-detail{max-height:0;overflow:hidden;transition:max-height .2s ease;text-align:left;}
  .case-light.expanded .case-detail{max-height:600px;margin-top:16px;padding-top:16px;border-top:1px solid var(--cream-deep);}
  .case-detail .cd-row{margin-bottom:12px;}
  .case-detail .cd-label{font-size:10.5px;letter-spacing:0.6px;text-transform:uppercase;color:var(--warm-grey);font-weight:600;margin-bottom:4px;}
  .case-detail p{font-size:12.5px;color:var(--charcoal);line-height:1.6;}

  /* Espace client - pillars (Rockfi-inspired) */
  .step-desc-row{display:flex;justify-content:space-between;max-width:520px;margin:0 auto;padding:0 10px;gap:10px;}
  .step-desc-row div{flex:1;text-align:center;font-size:11.5px;color:var(--warm-grey);line-height:1.4;}

  /* Ressources - articles */
  .article-row{display:grid;grid-template-columns:100px 1fr;gap:22px;padding:24px 0;border-top:1px solid var(--cream-deep);cursor:pointer;}
  .article-row:last-child{border-bottom:1px solid var(--cream-deep);}
  .article-row .a-date{font-size:11px;color:var(--bronze-dark);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
  .article-row h4{font-size:15.5px;color:var(--ink);margin:6px 0;}
  .article-row p{font-size:13px;color:var(--warm-grey);line-height:1.55;}
  .article-row .a-cat{font-size:10.5px;color:var(--warm-grey);text-transform:uppercase;letter-spacing:0.5px;}

  /* Ressources - guides / livres blancs */
  .guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .guide-card{background:var(--white);border:1px solid var(--cream-deep);}
  .guide-cover{height:120px;background:linear-gradient(135deg,var(--navy800),var(--ink));display:flex;align-items:center;justify-content:center;color:var(--bronze-light);font-family:'Cormorant Garamond',serif;font-size:15px;text-align:center;padding:14px;line-height:1.3;}
  .guide-body{padding:20px;}
  .guide-partner{font-size:10.5px;color:var(--bronze-dark);font-weight:600;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:8px;}
  .guide-body h4{font-size:14.5px;color:var(--ink);margin-bottom:8px;line-height:1.3;}
  .guide-body p{font-size:12.5px;color:var(--warm-grey);line-height:1.55;margin-bottom:14px;}
  .guide-cta{font-size:12px;color:#fff;background:var(--bronze);padding:9px 14px;display:inline-block;cursor:pointer;font-weight:500;}
  .guide-form{display:none;margin-top:14px;gap:8px;}
  .guide-form.open{display:flex;}
  .guide-form input{flex:1;padding:9px 11px;border:1px solid var(--cream-deep);font-size:12.5px;}
  .guide-form button{background:var(--ink);color:#fff;border:none;padding:9px 14px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;}
  .guide-note{font-size:11px;color:var(--warm-grey);margin-top:8px;font-style:italic;}

  /* Ressources - événements */
  .event-row{display:grid;grid-template-columns:90px 1fr auto;gap:22px;align-items:center;background:var(--cream);border:1px solid var(--cream-deep);padding:20px 22px;margin-bottom:12px;}
  .event-date{text-align:center;background:var(--white);border:1px solid var(--cream-deep);padding:10px 4px;}
  .event-date .day{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--ink);font-weight:600;line-height:1;}
  .event-date .month{font-size:10px;color:var(--bronze-dark);text-transform:uppercase;letter-spacing:0.5px;}
  .event-row h4{font-size:15px;color:var(--ink);margin-bottom:4px;}
  .event-row p{font-size:12.5px;color:var(--warm-grey);}
  .event-row .e-status{font-size:11px;font-weight:600;padding:6px 12px;white-space:nowrap;}
  .event-row .e-status.upcoming{background:var(--bronze);color:#fff;}
  .event-row .e-status.past{background:var(--cream-deep);color:var(--warm-grey);}

  @media (max-width:900px){
    .case-light-grid, .guide-grid{grid-template-columns:1fr 1fr;}
    .article-row, .event-row{grid-template-columns:1fr;}
    .step-desc-row{display:none;}
  }

  /* Espace client - sidebar app */
  #view-espace{background:var(--cream);}
  .espace-shell{display:flex;align-items:flex-start;}
  .espace-sidebar{width:230px;flex-shrink:0;background:var(--white);border-right:1px solid var(--cream-deep);min-height:calc(100vh - 44px);padding:26px 0;position:sticky;top:44px;}
  .espace-sidebar .es-user{display:flex;align-items:center;gap:10px;padding:0 22px 20px;border-bottom:1px solid var(--cream-deep);margin-bottom:14px;}
  .espace-sidebar .es-user .av-mini{width:34px;height:34px;border-radius:50%;background:var(--bronze);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;color:#fff;font-size:14px;flex-shrink:0;}
  .espace-sidebar .es-user .es-name{font-size:13px;font-weight:600;color:var(--ink);}
  .espace-sidebar .es-user .es-sub{font-size:10.5px;color:var(--warm-grey);}
  .espace-navlabel{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--warm-grey);padding:0 22px;margin:16px 0 6px;}
  .espace-nav-item{display:flex;align-items:center;gap:10px;padding:11px 22px;font-size:13.5px;color:var(--charcoal);cursor:pointer;border-left:3px solid transparent;}
  .espace-nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--warm-grey);flex-shrink:0;}
  .espace-nav-item:hover{background:var(--cream);}
  .espace-nav-item.active{background:var(--cream);border-left-color:var(--bronze);color:var(--ink);font-weight:600;}
  .espace-nav-item.active .dot{background:var(--bronze);}

  .espace-main{flex:1;min-width:0;padding:36px 40px 60px;}
  .espace-tabpanel{display:none;}
  .espace-tabpanel.active{display:block;}
  .espace-panel-head{margin-bottom:26px;}
  .espace-panel-head h2{font-size:22px;}
  .espace-panel-head p{color:var(--warm-grey);font-size:13px;margin-top:4px;}

  .esp-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .esp-kpi-card{background:var(--white);border:1px solid var(--cream-deep);padding:18px 20px;}
  .esp-kpi-card .k-label{font-size:10.5px;color:var(--warm-grey);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
  .esp-kpi-card .k-value{font-family:'Cormorant Garamond',serif;font-size:23px;color:var(--ink);font-weight:600;}
  .esp-kpi-card .k-note{font-size:10.5px;color:var(--bronze-dark);margin-top:4px;}

  .esp-card{background:var(--white);border:1px solid var(--cream-deep);padding:22px;margin-bottom:18px;}
  .esp-card h4{font-size:14.5px;color:var(--ink);margin-bottom:14px;}
  .esp-2col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}

  .esp-bar-row{margin-bottom:14px;}
  .esp-bar-row:last-child{margin-bottom:0;}
  .esp-bar-row .bar-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--charcoal);margin-bottom:5px;}
  .esp-bar-track{height:6px;background:var(--cream-deep);}
  .esp-bar-fill{height:100%;background:var(--bronze);}

  .rdv-panel-box{background:var(--white);border:1px solid var(--cream-deep);padding:30px;}
  .rdv-empty{text-align:center;padding:30px 10px;color:var(--warm-grey);}
  .rdv-empty .rdv-icon{width:44px;height:44px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:18px;color:var(--bronze-dark);}

  @media (max-width:1000px){
    .espace-sidebar{display:none;}
    .esp-kpi-grid{grid-template-columns:1fr 1fr;}
    .esp-2col{grid-template-columns:1fr;}
  }

  /* ===== Back-office admin ===== */
  #view-admin{background:#F7F5F1;min-height:100vh;}
  .admin-shell{display:flex;align-items:flex-start;}
  .admin-sidebar{width:220px;flex-shrink:0;background:var(--white);border-right:1px solid var(--cream-deep);min-height:100vh;padding:22px 0;position:sticky;top:0;}
  .admin-sidebar .a-logo{display:flex;align-items:center;gap:8px;padding:0 20px 20px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px;color:var(--ink);letter-spacing:1px;border-bottom:1px solid var(--cream-deep);margin-bottom:14px;}
  .admin-sidebar .a-navlabel{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--warm-grey);padding:0 20px;margin-bottom:8px;}
  .admin-nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:13px;color:var(--charcoal);cursor:pointer;border-left:3px solid transparent;}
  .admin-nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--warm-grey);flex-shrink:0;}

&lt;script&gt;
function showView(id){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('visible'); });
  var el = document.getElementById(id);
  if (el) el.classList.add('visible');
  window.scrollTo(0,0);
  history.replaceState(null, '', '#' + id);
  var header = document.querySelector('header');
  var footer = document.querySelector('footer');
  if (id === 'view-admin') {
    if (header) header.style.display = 'none';
    if (footer) footer.style.display = 'none';
  } else {
    if (header) header.style.display = '';
    if (footer) footer.style.display = '';
  }
}
function scrollToId(id){
  var el = document.getElementById(id);
  if (el) el.scrollIntoView({behavior:'smooth'});
}
function selectOne(el){
  var siblings = el.parentElement.children;
  for (var i=0;i&lt;siblings.length;i++){ siblings[i].classList.remove('selected'); }
  el.classList.add('selected');
}
function toggleMulti(el){ el.classList.toggle('selected'); }
function toggleProd(el){ el.classList.toggle('expanded'); }
function togglePartnerCat(el){
  selectOne(el);
  var cat = el.getAttribute('data-cat');
  document.querySelectorAll('.partner-cat-fields').forEach(function(g){
    g.classList.toggle('active', g.getAttribute('data-cat') === cat);
  });
}
function toggleGuideForm(el){
  var form = el.nextElementSibling;
  if (form &amp;&amp; form.classList.contains('guide-form')) form.classList.toggle('open');
}

function selectAccompStep(el){
  var step = el.getAttribute('data-step');
  document.querySelectorAll('.step-nav-item').forEach(function(i){ i.classList.remove('viewing'); });
  el.classList.add('viewing');
  document.querySelectorAll('.step-explain').forEach(function(p){ p.classList.remove('active'); });
  var panel = document.querySelector('.step-explain[data-explain=&quot;' + step + '&quot;]');
  if (panel) panel.classList.add('active');
}
function showEspaceTab(el, name){
  document.querySelectorAll('.espace-nav-item').forEach(function(t){ t.classList.remove('active'); });
  var tabEl = el || document.querySelector('.espace-nav-item[data-esptab=&quot;' + name + '&quot;]');
  if (tabEl) tabEl.classList.add('active');
  document.querySelectorAll('.espace-tabpanel').forEach(function(p){ p.classList.remove('active'); });
  var panel = document.getElementById('esptab-' + name);
  if (panel) panel.classList.add('active');
  var main = document.querySelector('.espace-main');
  if (main) main.scrollTop = 0;
}

function showAdminTab(el, name){
  document.querySelectorAll('.admin-nav-item').forEach(function(t){ t.classList.remove('active'); });
  var tabEl = el || document.querySelector('.admin-nav-item[data-admintab=&quot;' + name + '&quot;]');
  if (tabEl) tabEl.classList.add('active');
  document.querySelectorAll('.admin-tab-panel').forEach(function(p){ p.classList.remove('active'); });
  var panel = document.getElementById('admintab-' + name);
  if (panel) panel.classList.add('active');
  var main = document.querySelector('.admin-main');
  if (main) main.scrollTop = 0;
}

function moveBlock(btn, dir){
  var block = btn.closest('.block');
  var parent = block.parentElement;
  if (dir === -1 &amp;&amp; block.previousElementSibling) parent.insertBefore(block, block.previousElementSibling);
  else if (dir === 1 &amp;&amp; block.nextElementSibling) parent.insertBefore(block.nextElementSibling, block);
}
function duplicateBlock(btn){
  var block = btn.closest('.block');
  var clone = block.cloneNode(true);
  block.parentElement.insertBefore(clone, block.nextSibling);
}
function deleteBlock(btn){
  var block = btn.closest('.block');
  if (confirm('Supprimer ce bloc ?')) block.remove();
}
document.getElementById('exportBtn').addEventListener('click', function(){
  var clone = document.documentElement.cloneNode(true);
  clone.querySelector('#editToolbar') &amp;&amp; clone.querySelector('#editToolbar').remove();
  clone.querySelector('#exportPanel') &amp;&amp; clone.querySelector('#exportPanel').remove();
  clone.querySelectorAll('.block-ctrl').forEach(function(el){ el.remove(); });
  clone.querySelectorAll('[contenteditable]').forEach(function(el){ el.removeAttribute('contenteditable'); });
  var htmlOut = '&lt;' + '!DOCTYPE html&gt;' + clone.outerHTML;
  var blob = new Blob([htmlOut], {type:'text/html'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'horkos_app_modifie.html';
  a.click();
  document.getElementById('exportPanel').style.display = 'block';
  document.getElementById('exportText').value = 'Fichier telecharge : horkos_app_modifie.html - renvoyez-le pour que j applique les changements.';
});

var initial = location.hash ? location.hash.substring(1) : 'view-home';
if (document.getElementById(initial)) { showView(initial); }
&lt;/script&gt;
